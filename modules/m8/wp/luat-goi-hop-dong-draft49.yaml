# M8 — hợp đồng đề xuất 1.0.0-draft.49 (BẢN ĐỌC ĐƯỢC cho m34, 20/11/2026 16:09)
# Đã vào specs/ của repo ivr: phần quản trị (L-06) ở W-0555, intake chế độ luật (L-05) ở W-0558 `c2bb7064` (24/11, hash YAML 26a7bbe5…c729, chưa push); gọi lại thủ công (L-07) ở W-0559 `6ed2d535` (hash YAML mới 56cd056d…6229, đã lên origin + GitHub 25/11 07:26). Nguồn thật là YAML trong repo ivr; tệp này chỉ là bản đọc của 20/11.
# Chỉ THÊM so với draft.48; callback (`order-core-ivr-callback.target-v1.yaml`, hash 323ba1d2…) KHÔNG đổi một byte.
# Đọc cùng: modules/m8/wp/luat-goi-thiet-ke.md (mô hình bảng quy tắc, lý do kết quả cuối).

# ===================================================================================== 1. Intake (POST /v1/ivr/order-confirmation/tasks)
intake:
  mode_v4_unchanged: >-
    Gửi ĐỦ ba trường `attempt_policy_version`, `max_customer_attempts`, `attempt_offsets_seconds` (như draft.48) →
    đường v4 y nguyên: M8 kiểm khớp chính xác bảng policy, lệch → 409 IVR_POLICY_MISMATCH. Đợt thử MobiFone ~24/11 dùng đường này.
  mode_rules_new: >-
    KHÔNG gửi cả ba → chế độ luật: M8 chọn luật ACTIVE theo `program_code`, chụp bản luật vào job (bất biến),
    tự lên lịch mọi cuộc gọi. Gửi một phần (1–2 trong 3 trường) → 400 IVR_MALFORMED_REQUEST nêu tên trường thiếu.
    Không có luật ACTIVE cho chương trình → 200 với decision TASK_HELD_POLICY_MISSING (như khi thiếu policy hôm nay) và `blocked_reasons: ["RULE_SET_NOT_ACTIVE"]` (mảng `blocked_reasons[]` có sẵn của IvrTaskIntakeResult; KHÔNG thêm trường `reason`).
  fields_in_rules_mode:
    confirmation_window_started_at: Giờ đơn đủ điều kiện (thời điểm M3 mở xác nhận). M8 đặt T0 theo khung giờ gọi.
    confirmation_window_expires_at: >-
      TRẦN GIỮ ĐƠN của M3 (bắt buộc như nay). M8 không lên lịch cuộc nào vượt trần và luôn gửi kết quả cuối trước trần
      (job hết tầm xa sớm hơn thì kết thúc sớm hơn). Không còn ràng buộc "bằng đúng độ dài cửa sổ policy".
    recall_of_task_id: Như draft.47 (gọi lại thủ công = task mới nối dòng dõi) — xem mục 4.
  ack_additions:   # thêm vào IvrTaskIntakeResult khi chế độ luật (v4 không có)
    call_rule_set: { id: string, version: integer, program_code: string }
    first_call_due_at: date-time (UTC)
    planned_horizon_at: date-time (UTC)   # min(T0 + max_horizon_minutes, confirmation_window_expires_at); M3 đặt watchdog ≥ giá trị này
    # earliest_final_at: BỎ (24/11, D-m8-154): ack thật chỉ có ba trường trên; planned_horizon_at của đơn giữ ngoài khung = confirmation_window_expires_at
  status_additions: >-
    GET /tasks/{taskId}/result và /call-jobs/{id}: thêm `call_rule_set{id,version}`, `counted_attempts` (số cuộc đã tính lượt),
    `last_attempt_ended_at`, `next_attempt_due_at` (null khi hết hoặc đang gọi). Mã `attempt_policy_code` của task chế độ luật = "rules:<PROGRAM>:v<N>".

# ===================================================================================== 2. Kết quả cuối (callback KHÔNG đổi dây)
callback_semantics:
  unchanged: [result_type enum, recommended_core_action enum, payload fields, hash 323ba1d2…, revoke]
  M3_should_treat_as_needs_staff:   # "chưa có 0/1"
    - IVR_NO_ANSWER_FINAL
    - IVR_INVALID_PHONE_FINAL
    - IVR_CONFIRMATION_WINDOW_EXPIRED
    - IVR_CAPACITY_EXCEPTION
  M3_decides_by: result_type (+ result_reason để hiển thị); không cần nhãn mới. Nhãn `recommended_core_action` cũ giữ nguyên, M3 không còn suy "huỷ" từ chúng.
  attempt_number: số cuộc đã tính lượt (≤ 10; trần `max_total_calls` của luật ≤ 10)
  occurred_at: giờ cuộc cuối kết thúc
  result_reason_stable_values:
    IVR_NO_ANSWER_FINAL: ["RULES_EXHAUSTED:<G>", "HORIZON_REACHED:<G>", "SESSION_ENDED:<G>"]
    IVR_INVALID_PHONE_FINAL: [UNREACHABLE, INVALID_DESTINATION]
    IVR_CONFIRMATION_WINDOW_EXPIRED: [WINDOW_EXPIRED_ALL_CALLS_TECHNICAL_FAILURE, WINDOW_EXPIRED_BEFORE_FINAL_RESULT]
    IVR_CAPACITY_EXCEPTION: [CAPACITY_UNAVAILABLE]
    G_is_one_of: [RING_TIMEOUT, BUSY, SUBSCRIBER_ABSENT, REJECTED, ANSWERED_NO_INPUT, WRONG_INPUT]

# ===================================================================================== 3. API quản trị luật (tiền tố /v1/ivr/order-confirmation)
auth:
  headers: [Authorization Bearer (tầng theo thao tác), X-Service-Scope khớp tầng, X-Actor-Id (bắt buộc mọi thao tác), X-Correlation-Id, "Idempotency-Key (tuỳ chọn, POST/PUT; CÓ khoá thì thân BẮT BUỘC có `reason` chuỗi không rỗng, xem decisions_for_m34.1)"]
  tiers:
    ivr.admin.read:   [GET mọi đường]
    ivr.admin.write:  [POST tạo nháp, PUT sửa nháp, :validate, :simulate, :submit]
    ivr.admin.danger: [":approve", ":reject", ":activate", ":retire"]  # đổi hành vi gọi khách ngay → thêm X-Action-Reason (như pause/resume hàng đợi)
    # Thiếu X-Action-Reason ở đường danger → 403 IVR_FORBIDDEN_CALLER (như pause/resume hàng đợi; chốt 20/11 theo kiểm của coder W-0555), không phải 400.
  permission_header: >-
    X-Call-Rule-Permissions (M3 tự khai như X-Script-Permissions): IVR_CALL_RULE_EDIT (soạn, kiểm, mô phỏng, gửi duyệt),
    IVR_CALL_RULE_APPROVE (duyệt, trả về), IVR_CALL_RULE_ACTIVATE (áp dụng, ngừng). Người duyệt PHẢI khác người soạn (so X-Actor-Id) → vi phạm: 403.
  errors_reuse_existing_codes: >-
    Không thêm mã lỗi mới (bộ 18 mã giữ nguyên). 400 IVR_MALFORMED_REQUEST (định dạng/định nghĩa luật sai; `details.errors[]` = {path (JSON pointer), code, message});
    401 IVR_UNAUTHENTICATED; 403 sai tầng/thiếu permission/vi phạm người duyệt ≠ người soạn; 404 IVR_NOT_FOUND;
    409 IVR_VERSION_CONFLICT (If-Match lệch, hoặc chuyển trạng thái không hợp lệ: details.current_status); 429 IVR_RATE_LIMITED.
paths:
  /call-rule-sets:
    get:  { tier: read,  query: [program_code, status, limit, page_token], returns: "{items: CallRuleSetSummary[], next_page_token}" }
    post: { tier: write, body: "{program_code, definition?: CallRuleDefinition, based_on?: ruleSetId, notes?}", returns: "201 CallRuleSet (DRAFT)", note: "based_on = sao chép định nghĩa từ bản khác; không có cả hai → luật rỗng bị :validate từ chối" }
  /call-rule-sets/limits:
    get:  { tier: read,  returns: "{calling_envelope: {GOLDEN_HOUR: windows, TWENTY_FOUR_SEVEN: windows}, max_total_calls_cap: 10, min_gap_seconds_floor: 60}", note: "vỏ giờ gọi triển khai: khung của luật chỉ được hẹp hơn hoặc bằng" }
  /call-rule-sets/effective/{programCode}:
    get:  { tier: read,  returns: "CallRuleSet ACTIVE của chương trình; 404 nếu chưa có" }
  /call-rule-sets/{ruleSetId}:
    get:  { tier: read,  returns: "CallRuleSet (kèm definition, người/giờ từng bước)" }
    put:  { tier: write, headers: "If-Match: <row_version>", body: "{definition, notes?}", rule: "chỉ khi status = DRAFT", returns: "CallRuleSet" }
  "/call-rule-sets/{ruleSetId}:validate":
    post: { tier: write, returns: "{valid: boolean, errors: ValidationError[], warnings: ValidationError[]}", note: "luôn 200; không đổi trạng thái" }
  "/call-rule-sets/{ruleSetId}:simulate":
    post: { tier: write, body: "{received_at, outcomes: OutcomeGroup[], session_ends_at?, hold_ceiling_at?, assumed_call_seconds? (mặc định 30)}", returns: "{calls: [{number, at, assumed_outcome, matched_row_id}], final: {result_type, result_reason, at}, warnings[]}", note: "không ghi gì; chạy bộ máy luật thật trên bản đang xem" }
  "/call-rule-sets/{ruleSetId}:submit":   { post: { tier: write,  rule: "DRAFT → SUBMITTED; bắt buộc :validate không lỗi" } }
  "/call-rule-sets/{ruleSetId}:reject":  { post: { tier: danger, rule: "SUBMITTED → DRAFT (trả về để sửa); cần IVR_CALL_RULE_APPROVE; bản trả về sửa lại được và gửi duyệt lại được; ghi audit kèm người từ chối (thêm 20/11 theo kiểm của verifier W-0553)" } }
  "/call-rule-sets/{ruleSetId}:approve":  { post: { tier: danger, rule: "SUBMITTED → APPROVED; người duyệt ≠ người soạn" } }
  "/call-rule-sets/{ruleSetId}:activate": { post: { tier: danger, rule: "APPROVED → ACTIVE; ngừng bản ACTIVE cũ của cùng chương trình trong cùng giao dịch; chỉ đơn MỚI nhận sau thời điểm này dùng bản mới, đơn đã nhận giữ bản chụp cũ" } }
  "/call-rule-sets/{ruleSetId}:retire":   { post: { tier: danger, rule: "ACTIVE|APPROVED → RETIRED; đơn đang chạy chạy tiếp theo bản chụp; chương trình không còn luật ACTIVE thì đơn mới ở chế độ luật bị giữ (TASK_HELD_POLICY_MISSING, `blocked_reasons: ["RULE_SET_NOT_ACTIVE"]`)" } }
schemas:
  OutcomeGroup: { enum: [RING_TIMEOUT, BUSY, SUBSCRIBER_ABSENT, REJECTED, ANSWERED_NO_INPUT, WRONG_INPUT, UNREACHABLE, INVALID_DESTINATION] }
  CallRuleSet:
    required: [id, program_code, version, status, definition, row_version]
    properties:
      id: string
      program_code: { enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN] }
      version: integer   # tăng theo chương trình
      status: { enum: [DRAFT, SUBMITTED, APPROVED, ACTIVE, RETIRED] }
      definition: CallRuleDefinition
      row_version: string   # dùng cho If-Match
      notes: string
      created_by/created_at, submitted_by/submitted_at, approved_by/approved_at, activated_by/activated_at, retired_by/retired_at: audit
  CallRuleDefinition:     # nguyên văn modules/m8/wp/luat-goi-thiet-ke.md §1
    time_zone: { const: Asia/Ho_Chi_Minh }
    calling_windows: "[{days?: [MON..SUN] (mặc định cả tuần), from: 'HH:MM', to: 'HH:MM' (loại trừ)}]  # không chồng nhau; nằm trong vỏ /call-rule-sets/limits"
    min_gap_seconds: "integer ≥ 60 (nghỉ sau cuộc đã tính lượt)"
    rows: "[{id, when: {calls_made?: {from,to}, outcomes?: [OutcomeGroup], day_index?: {from,to}}, then: {action: CALL_AFTER{minutes} | CALL_IN_WINDOW{from,to,not_before_day} | FINISH{result: IVR_NO_ANSWER_FINAL|IVR_INVALID_PHONE_FINAL}}}]  # dòng đầu khớp thắng"
    limits: "{max_total_calls 1..10, max_calls_per_day_per_order, max_calls_per_phone_per_day, max_horizon_minutes, stop_after_session_end_minutes|null (chỉ Giờ Vàng), technical_retry_limit}"
  ValidationError: { path: "JSON pointer, vd /rows/3/then/minutes", code: "mã máy, vd MINUTES_NOT_POSITIVE", message: "tiếng Việt cho người đọc" }

# ===================================================================================== 4. Gọi lại thủ công (nút "Gọi lại bằng IVR")
recall:
  how: Task mới có `recall_of_task_id` = task cuối của đơn (hợp đồng draft.47), chạy luật từ đầu.
  l07_done: >-
    L-07 XONG phía M8 (W-0559 `6ed2d535`, 24/11, đã lên origin + GitHub 25/11 07:26): task chế độ luật mang `recall_of_task_id` được nhận như task chế độ luật thường (hết 409 `RECALL_RULE_MODE_NOT_SUPPORTED`);
    cuộc đầu theo `calling_windows` của luật (giữ tới khung kế trong trần M3); job mới đếm từ 0; trần số điện thoại/ngày đếm xuyên job; gọi lại KHÔNG bị mốc phiên Giờ Vàng
    (`session_ends_at` không đòi, không lưu; luật được đọc không có hai mốc phiên); task gốc phải có và cùng đơn, đơn không còn chuỗi mở (như v4). Task của đơn M8 chưa từng nhận
    task nào thì gửi như task thường, KHÔNG có `recall_of_task_id`. Hash YAML CUỐI (25/11, sau cổng Nguy hiểm, W-0560 `30ceb19c`) `af5b19204447276de55aa8f4f53a80364818ed46f74d782f95700cc2ff322e47` (chỉ đổi mô tả); callback không đổi.
  changed_vs_draft47:
    - Bỏ khung giờ gọi lại cố định 08–09/13–14/20–21 (RECALL_OUTSIDE_ALLOWED_HOURS không còn trả ở chế độ luật). Ngoài khung giờ gọi → đơn được nhận và giữ tới khung kế (ack có first_call_due_at), như đơn giữ ban đêm.
    - Chạm trần cuộc mỗi số mỗi ngày → nhận và dời sang ngày kế (không từ chối).
  still_refused_sync: [RECALL_ORIGINAL_TASK_UNKNOWN, RECALL_ORDER_HAS_OPEN_CALL_JOB]   # TASK_BLOCKED_OPERATIONAL + reason, như nay
  new_refusal: "TASK_BLOCKED_OPERATIONAL / TASK_HELD_POLICY_MISSING với blocked_reasons: [\"RULE_SET_NOT_ACTIVE\"] (chương trình chưa có luật ACTIVE); lý do nằm trong mảng blocked_reasons[], như các lý do RECALL_* hiện có"

# ===================================================================================== 5. Tương thích
compat:
  - Mọi đường draft.48 giữ nguyên hành vi; trường mới chỉ thêm, trường cũ ở intake thành tuỳ chọn có điều kiện.
  - M3 cũ (LEGACY_V4) chạy y nguyên; cờ chế độ do M3 quyết (app.ivr-rules.mode).
