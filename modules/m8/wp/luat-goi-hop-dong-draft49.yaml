# ===================================================================================== 6. Chốt 6 điểm m34 hỏi (20/11/2026, m8 trả lời; đã sửa chỗ liên quan ở các mục trên)
decisions_for_m34:
  1_idempotency_and_put:
    - "PUT /call-rule-sets/{id} BẮT BUỘC If-Match (thiếu → 400 IVR_MALFORMED_REQUEST; lệch → 409 IVR_VERSION_CONFLICT)."
    - "Idempotency-Key TUỲ CHỌN và ĐƯỢC TÔN TRỌNG trên mọi POST/PUT quản trị luật (create, PUT, :validate, :simulate, :submit, :approve, :activate, :retire), cùng cơ chế với `/scripts/…` (MutationReplayFilter keyRequired:false): cùng khoá + cùng thân → phát lại đúng phản hồi cũ; cùng khoá + thân khác → 409 IVR_IDEMPOTENCY_CONFLICT. M3 gửi khoá mới cho mỗi thao tác người dùng."
    - "CÓ Idempotency-Key thì thân BẮT BUỘC có `reason` là chuỗi không rỗng (không chỉ khoảng trắng); thiếu hoặc rỗng → 400 IVR_MALFORMED_REQUEST ('A mutation reason is required.'), kiểm TRƯỚC khi phát lại nên khoá cũ không che được thân sai. Mã: MutationReplayFilter.cs; tài liệu: docs/operations/call-rules-admin.md §3; OpenAPI draft.49 cùng nói vậy (bổ sung vào YAML nháp này 21/11 theo m34). Không có khoá thì `reason` tuỳ chọn (lấy từ X-Action-Reason hoặc câu cố định theo thao tác). `reason` luôn qua bộ lọc dữ liệu cá nhân (≤ 500 ký tự): sai → 400 IVR_MALFORMED_REQUEST, details.errors[] = {path: \"/reason\", code: REASON_REFUSED}."
  2_permission_header:
    - "X-Call-Rule-Permissions: danh sách phân tách dấu phẩy, bỏ khoảng trắng hai đầu, BỎ phần tử rỗng, tối đa 16 phần tử, so khớp CHÍNH XÁC và PHÂN BIỆT hoa thường (chữ hoa như hằng): IVR_CALL_RULE_EDIT, IVR_CALL_RULE_APPROVE, IVR_CALL_RULE_ACTIVATE. Phần tử lạ bị bỏ qua. Cùng cách xử lý với X-Script-Permissions hiện có."
    - "Ánh xạ: soạn/PUT/:validate/:simulate/:submit cần EDIT; :approve cần APPROVE; :activate và :retire cần ACTIVATE. Mọi GET chỉ cần tầng read, không cần permission. Four-eyes so X-Actor-Id: người :approve phải khác người tạo bản (created_by) và khác người :submit; X-Actor-Id của M3 phải là id người dùng ổn định giữa các bước."
  3_golden_hour_first_call:
    - "Chế độ luật: M3 gửi confirmation_window_started_at đã tính (Giờ Vàng: hết phiên + 10 phút như nay); M8 dùng làm T0, KHÔNG cộng thêm; luật chỉ quyết khung giờ + cuộc kế."
    - "Mở đường cho sau này (mặc định để trống = không làm gì): tham số tuỳ chọn limits.first_call_delay_after_session_end_minutes trong luật Giờ Vàng; có giá trị thì T0 = max(started_at do M3 gửi, session_ends_at + giá trị). Khi Toàn muốn cấu hình mốc này, M3 bỏ phần tự tính mà không đổi hợp đồng."
  4_no_active_rule:
    - "Intake chế độ luật khi chương trình chưa có luật ACTIVE: 200 TASK_HELD_POLICY_MISSING + `blocked_reasons: [\"RULE_SET_NOT_ACTIVE\"]` (không có trường `reason`); M8 KHÔNG lưu task/job nào (không có ivr_call_job_id) nên không có gì để 'thả'. Khi luật ACTIVE xuất hiện, M3 gửi LẠI intake (task_id mới + Idempotency-Key mới); nút 'Gọi lại bằng IVR' của nhân viên là đường đó. M8 không tự thử lại."
  5_ceiling_margin:
    - "Trần giữ đơn = confirmation_window_expires_at. M8 không bắt đầu cuộc nào sau trần − 240 giây (trần 120 giây mỗi cuộc W-0550 + biên) và gửi xong kết quả cuối ≤ trần − 120 giây trong điều kiện bình thường; callback retry (250 ms → 5 phút, tới hạn cấu hình) vẫn tiếp tục nếu M3 tạm lỗi. Hai biên là cấu hình worker (mặc định 240/120 giây), không nằm trong luật."
    - "M3 đặt watchdog = trần + 5 phút và giữ luật 'bấm 1/0 ghi nhận trước hạn vẫn tính dù tới muộn' (dựa customer_input_at, QT-CHUNG-002; hiện cờ IncludeCustomerInputAt của M8 TẮT mặc định — m8 sẽ bật khi bật chế độ luật; ghi vào L-09)."
  6_counted_attempts_and_revoke:
    - "GET /tasks/{id}/result và /call-jobs/{id} trả counted_attempts (số cuộc tính lượt, 0 nếu chưa gọi được cuộc nào), last_attempt_ended_at, next_attempt_due_at (null khi đã kết thúc) CẢ SAU KHI job kết thúc. Dọn dữ liệu: hiện worker M8 chỉ dọn dữ liệu giọng nói (365 ngày); lượt gọi/job chưa có job dọn trong cấu hình. Cam kết đọc được tối thiểu 90 ngày sau kết thúc; đổi thì báo m34 trước."
    - "Revoke giữ NGUYÊN như draft.48: việc chưa quay số đóng im lặng (mọi cuộc chưa gọi của job bị huỷ, không callback); cuộc ĐANG gọi được kết thúc và kết quả/callback thật VẪN được phát (không đổi hợp đồng), nhưng không có cuộc nào bắt đầu sau đó. M3 bỏ qua callback đó (trả 409 REJECTED_STALE → M8 không retry). Không đổi sang 'không phát callback'."

# ===================================================================================== 7. Giờ Vàng và phiên (m34 trả số thật 20/11, đã chốt)
golden_hour_session:
  facts_from_m3: >-
    Từ 16/11 (QT-CHUNG-015) M3 KHÔNG gửi `session_ends_at` (và `golden_hour_session_id`) cho đơn Giờ Vàng. started_at (= giờ gọi đầu) =
    max(giờ khách thanh toán/đặt, giờ hết phiên thật + 10 phút). Nên v4 thực tế không áp mốc phiên +5 phút nào.
  decision:
    - "Luật Giờ Vàng dựng sẵn: `stop_after_session_end_minutes` = null và `first_call_delay_after_session_end_minutes` = null (không mốc, khớp thực tế)."
    - "Chế độ luật: M8 chỉ dùng `session_ends_at` khi luật có một trong hai tham số trên. Luật không dùng thì M8 BỎ QUA trường phiên (kể cả không từ chối đơn tới sau hết phiên bằng GOLDEN_HOUR_SESSION_ENDED như đường v4)."
    - "Luật có tham số dùng phiên mà đơn Giờ Vàng thiếu `session_ends_at` → 400 IVR_MALFORMED_REQUEST nêu tên trường (lỗi cấu hình hiện ngay, không lặng lẽ bỏ mốc). Trước khi áp dụng luật loại này, báo m34 để M3 gửi `session_ends_at` thật."
    - "`:validate` báo LỖI nếu cả hai tham số có giá trị mà stop_after ≤ first_call_delay (mọi đơn bị cắt)."
